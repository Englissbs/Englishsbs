<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Step by Step - Unidad 4</title>
    <style>
        :root { --primary: #002d72; --secondary: #c8102e; --success: #28a745; --danger: #dc3545; --bg: #f4f4f9; --text-muted: #666; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .container { background: white; max-width: 650px; width: 100%; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .logo { width: 400px; margin-bottom: 20px; }
        .screen { display: none; }
        .active { display: block; }
        .btn { background: var(--primary); color: white; padding: 15px 30px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 90%; margin-top: 10px; transition: 0.3s; text-decoration: none; display: inline-block; }
        .btn:hover { background: var(--secondary); }
        .ex-header { display: block; font-size: 0.85em; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .question-text { text-align: left; color: var(--primary); font-size: 1.25em; margin: 0 0 20px 0; }
        .option { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 8px; cursor: pointer; text-align: left; background: white; font-size: 1em; transition: 0.2s; }
        .selected-correct { border-color: var(--success) !important; background: #d4edda !important; color: #155724; font-weight: bold; }
        .selected-incorrect { border-color: var(--danger) !important; background: #f8d7da !important; color: #721c24; font-weight: bold; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; text-align: left; font-weight: 500; border-left: 5px solid; }
        .feedback.correct { background: #d4edda; color: #155724; border-color: var(--success); }
        .feedback.incorrect { background: #fff3cd; color: #856404; border-color: #ffc107; }
        .grade-box { background: #f8f9fa; padding: 20px; border-radius: 10px; margin: 20px 0; border: 1px solid #ddd; }
        .grade-num { font-size: 3em; color: var(--primary); font-weight: bold; }
        .text-input { width: 90%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 5px; font-size: 1.1em; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo-container"><img src="assets/logo.jpg" alt="English Step by Step" class="logo"></div>
    
    <div id="welcome-screen" class="screen active">
        <h2>Bienvenido</h2>
        <p>Aprende Inglés paso a paso con <strong>Rafael</strong>.</p>
        <input type="text" id="userName" placeholder="Nombre completo" style="width:90%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:5px;">
        <input type="email" id="userEmail" placeholder="Tu correo electrónico" style="width:90%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:5px;">
        <div style="font-size: 0.85em; text-align: center; margin: 20px 5%; color: #555;">
            <input type="checkbox" id="legalConsent"> 
            <label for="legalConsent">Acepto el tratamiento de mis datos y autorizo el envío de información sobre clases en vivo en TikTok y YouTube.</label>
        </div>
        <button class="btn" onclick="startQuiz()">EMPEZAR PRÁCTICA</button>
    </div>

    <div id="quiz-screen" class="screen">
        <div id="progress" style="text-align: right; color: #666; font-size: 0.9em; margin-bottom: 10px;"></div>
        <span id="ex-label" class="ex-header"></span>
        <h3 id="question-text" class="question-text"></h3>
        <div id="options-container"></div>
        <div id="feedback-area" class="feedback"></div>
        <button id="next-btn" class="btn" style="display:none;" onclick="nextQuestion()">Siguiente Ejercicio</button>
    </div>

    <div id="final-screen" class="screen">
        <h2>¡Práctica Terminada, <span id="display-name"></span>!</h2>
        <div class="grade-box">
            <p>Tu calificación final:</p>
            <div id="final-grade" class="grade-num"></div>
            <p id="stats-text"></p>
        </div>
        <a id="wa-link" href="#" class="btn" style="background:#25d366;" target="_blank">Enviar resultados a Rafael</a>
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
            <a href="https://www.tiktok.com/@englishsbs.peru" target="_blank" class="btn" style="background:#000; width: 40%;">TikTok</a>
            <a href="https://www.youtube.com/@Englishsbs_peru" target="_blank" class="btn" style="background:#FF0000; width: 40%;">YouTube</a>
        </div>
        <hr style="margin: 20px 0; border: 0.5px solid #eee;">
        <button class="btn" style="background: #666; width: 90%;" onclick="location.reload()">Volver a realizar</button>
        <a href="https://englissbs.github.io/Englishsbs/" class="btn" style="background: #444; width: 90%;">Regresar al inicio</a>
    </div>
</div>

<script>
    const positives = ["¡Excelente!", "¡Muy bien!", "¡Fantástico!", "¡Increíble!", "¡Lo lograste!"];
    const supports = ["Casi, revisa la estructura.", "Intenta de nuevo.", "Buen intento, pero esta opción no encaja aquí."];

    const questions = [
        // SECCIÓN A (8)
        {n:"Ex. A-1", type:"choice", q:"____ he busy? Yes, ____.", options:[{t:"Is / he is", c:true, f:"Correcto: Is he busy? Yes, he is."}, {t:"Are / I am", c:false, f:"'Are' no va con 'he'."}, {t:"Is / he's", c:false, f:"No usamos contracción en respuestas cortas afirmativas."}]},
        {n:"Ex. A-2", type:"choice", q:"____ they busy? Yes, they ____.", options:[{t:"Are / are", c:true, f:"Plural: Are they...? Yes, they are."}, {t:"Are / our", c:false, f:"'Our' es posesivo."}, {t:"Is / are", c:false, f:"Sujeto plural requiere 'Are'."}]},
        {n:"Ex. A-3", type:"choice", q:"____ you busy? Yes, I ____.", options:[{t:"Are / am", c:true, f:"Para 'I' siempre usamos 'am'."}, {t:"Is / am", c:false, f:"'Is' no va con 'you'."}, {t:"Are / are", c:false, f:"No respondes con 'are' si hablas de ti."}]},
        {n:"Ex. A-4", q:"Mrs. Vargas is busy. ____ fixing ____ sink.", type:"choice", options:[{t:"She's / her", c:true}, {t:"He's / his", c:false}, {t:"She's / his", c:false}]},
        {n:"Ex. A-5", q:"I'm busy. ____ washing ____ hair.", type:"choice", options:[{t:"I'm / my", c:true}, {t:"My / I'm", c:false}, {t:"I'm / your", c:false}]},
        {n:"Ex. A-6", q:"Mr. Quispe is busy. ____ washing ____ car.", type:"choice", options:[{t:"He's / his", c:true}, {t:"His / he's", c:false}, {t:"He's / her", c:false}]},
        {n:"Ex. A-7", q:"Mr. and Mrs. Garcia are busy. ____ painting ____ kitchen.", type:"choice", options:[{t:"They're / their", c:true}, {t:"Their / they're", c:false}, {t:"They're / our", c:false}]},
        {n:"Ex. A-8", q:"Juan and I are busy. ____ cleaning ____ garage.", type:"choice", options:[{t:"We're / our", c:true}, {t:"They're / our", c:false}, {t:"We're / are", c:false}]},

        // SECCIÓN B (9)
        {n:"Ex. B-1", type:"text", q:"What's he doing? He's fixing ____ sink.", accepted:["his"], f:"Posesivo masculino."},
        {n:"Ex. B-2", type:"text", q:"What are they doing? They're cleaning ____ yard.", accepted:["their"], f:"Posesivo plural."},
        {n:"Ex. B-3", type:"text", q:"What's she doing? She's brushing ____ teeth.", accepted:["her"], f:"Posesivo femenino."},
        {n:"Ex. B-4", type:"text", q:"What are you doing? I'm reading ____ e-mail.", accepted:["my"], f:"Posesivo primera persona."},
        {n:"Ex. B-5", type:"text", q:"Are they busy? Yes, They're feeding ____ cat.", accepted:["their"]},
        {n:"Ex. B-6", type:"text", q:"Is he busy? Yes, He's doing ____ homework.", accepted:["his"]},
        {n:"Ex. B-7", type:"text", q:"Are you busy? Yes, I'm washing ____ clothes.", accepted:["my"]},
        {n:"Ex. B-8", type:"text", q:"Is she busy? Yes, She's painting ____ kitchen.", accepted:["her"]},
        {n:"Ex. B-9", type:"text", q:"Are you and Tom busy? Yes, We're fixing ____ TV.", accepted:["our"]},

        // SECCIÓN C (5)
        {n:"Ex. C-1", type:"text", q:"What's Mr. Sanchez doing? (fix / his car)", accepted:["He is fixing his car", "He's fixing his car"], f:"Sujeto + be + verb-ing + his car."},
        {n:"Ex. C-2", type:"text", q:"What are you doing? (do / my homework)", accepted:["I am doing my homework", "I'm doing my homework"]},
        {n:"Ex. C-3", type:"text", q:"What are Mr. and Mrs. Wu doing? (clean / their windows)", accepted:["They are cleaning their windows", "They're cleaning their windows"]},
        {n:"Ex. C-4", type:"text", q:"What's Mrs. Herrera doing? (feed / her dog)", accepted:["She is feeding her dog", "She's feeding her dog"]},
        {n:"Ex. C-5", type:"text", q:"What are you and Pablo doing? (paint / our apartment)", accepted:["We are painting our apartment", "We're painting our apartment"]}
    ];

    let current = 0, hits = 0;

    function startQuiz() {
        if(!document.getElementById('userName').value || !document.getElementById('legalConsent').checked) return alert("Completa tus datos.");
        document.getElementById('display-name').innerText = document.getElementById('userName').value;
        document.getElementById('welcome-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        show();
    }

    function show() {
        const q = questions[current];
        document.getElementById('progress').innerText = `Pregunta ${current+1} de ${questions.length}`;
        document.getElementById('ex-label').innerText = q.n;
        document.getElementById('question-text').innerText = q.q;
        const container = document.getElementById('options-container'); container.innerHTML = '';
        document.getElementById('feedback-area').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        if(q.type === "choice") {
            q.options.forEach(o => {
                const b = document.createElement('button'); b.className = 'option'; b.innerText = o.t;
                b.onclick = (e) => validate(o.c, o.t, o.f, e.target);
                container.appendChild(b);
            });
        } else {
            const input = document.createElement('input'); input.className = 'text-input'; input.id = 'user-input';
            const b = document.createElement('button'); b.className = 'btn'; b.innerText = "VERIFICAR";
            b.onclick = () => {
                const val = document.getElementById('user-input').value.trim();
                const clean = val.toLowerCase().replace(/[.'!]/g, "").replace(/\s+/g, " ");
                const ok = q.accepted.some(a => a.toLowerCase().replace(/[.'!]/g, "").replace(/\s+/g, " ") === clean);
                validate(ok, val, q.f, null);
            };
            container.appendChild(input); container.appendChild(b);
        }
    }

    function validate(ok, text, feed, element) {
        const f = document.getElementById('feedback-area');
        if(ok) {
            if(element) element.classList.add('selected-correct');
            f.innerText = `${positives[Math.floor(Math.random()*positives.length)]} ${feed || ""}`;
            f.className = "feedback correct";
            hits++;
        } else {
            if(element) element.classList.add('selected-incorrect');
            f.innerText = `${supports[Math.floor(Math.random()*supports.length)]} ${feed || ""}`;
            f.className = "feedback incorrect";
        }
        f.style.display = 'block';
        document.getElementById('next-btn').style.display = 'block';
        if(element) document.querySelectorAll('.option').forEach(x => x.style.pointerEvents = 'none');
    }

    function nextQuestion() { current++; if(current < questions.length) show(); else finish(); }

    function finish() {
        let rawGrade = (hits/questions.length)*100;
        let grade = Math.min(100, Math.round(rawGrade));
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('final-screen').classList.add('active');
        document.getElementById('final-grade').innerText = grade + "%";
        document.getElementById('stats-text').innerText = `Aciertos: ${hits} de ${questions.length}`;
        document.getElementById('wa-link').href = `https://wa.me/51990171277?text=Hola%20Rafael,%20saqué%20${grade}%%20en%20la%20Unidad%204.`;
        
        fetch("https://formspree.io/f/xojeljpo", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ Alumno: document.getElementById('userName').value, Nota: grade + "%", Detalle: "Unidad 4 completada" })
        });
    }
</script>
</body>
</html>
