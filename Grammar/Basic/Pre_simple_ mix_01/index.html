<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Step by Step - Practice</title>
    <style>
        :root { --primary: #002d72; --secondary: #c8102e; --success: #28a745; --danger: #dc3545; --bg: #f4f4f9; --text-muted: #666; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .container { background: white; max-width: 650px; width: 100%; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .logo { width: 400px; margin-bottom: 20px; }
        .screen { display: none; }
        .active { display: block; }
        .btn { background: var(--primary); color: white; padding: 15px 30px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 90%; margin-top: 10px; transition: 0.3s; text-decoration: none; display: inline-block; }
        .btn:hover { background: var(--secondary); }
        .ex-header { display: block; font-size: 0.85em; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .question-text { text-align: left; color: var(--primary); font-size: 1.25em; margin: 0 0 20px 0; line-height: 1.5; }
        .option { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 8px; cursor: pointer; text-align: left; background: white; font-size: 1em; transition: 0.2s; }
        .selected-correct { border-color: var(--success) !important; background: #d4edda !important; color: #155724; font-weight: bold; }
        .selected-incorrect { border-color: var(--danger) !important; background: #f8d7da !important; color: #721c24; font-weight: bold; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; text-align: left; font-weight: 500; border-left: 5px solid; }
        .feedback.correct { background: #d4edda; color: #155724; border-color: var(--success); }
        .feedback.incorrect { background: #fff3cd; color: #856404; border-color: #ffc107; }
        .grade-box { background: #f8f9fa; padding: 20px; border-radius: 10px; margin: 20px 0; border: 1px solid #ddd; }
        .grade-num { font-size: 3em; color: var(--primary); font-weight: bold; }
        .text-input { width: 90%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 5px; font-size: 1.1em; }
        .dialogue-box { background: #f0f4f8; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: left; border-left: 4px solid var(--primary); }
    </style>
</head>
<body>
<div class="container">
    <div class="logo-container"><img src="assets/logo.jpg" alt="English Step by Step" class="logo"></div>
    
    <div id="welcome-screen" class="screen active">
        <h2>BIENVENIDO</h2>
        <p>Aprende Inglés paso a paso con <strong>Rafael</strong>.</p>
        <input type="text" id="userName" placeholder="Nombre completo" style="width:90%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:5px;">
        <input type="email" id="userEmail" placeholder="Tu correo electrónico" style="width:90%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:5px;">
        <div style="font-size: 0.85em; text-align: center; margin: 20px 5%; color: #555; line-height: 1.5;">
            <input type="checkbox" id="legalConsent"> 
            <label for="legalConsent">Acepto el tratamiento de mis datos personales para recibir mi feedback y autorizo el envío de información comercial, promociones y avisos de clases en vivo (Lives) en TikTok y YouTube.</label>
        </div>
        <button class="btn" onclick="startQuiz()">EMPEZAR PRÁCTICA</button>
    </div>

    <div id="quiz-screen" class="screen">
        <div id="progress" style="text-align: right; color: #666; font-size: 0.9em; margin-bottom: 10px;"></div>
        <span id="ex-label" class="ex-header"></span>
        <div id="question-area"></div>
        <div id="options-container"></div>
        <div id="feedback-area" class="feedback"></div>
        <button id="next-btn" class="btn" style="display:none;" onclick="nextQuestion()">Siguiente Ejercicio</button>
    </div>

    <div id="final-screen" class="screen">
        <h2>¡Excelente trabajo, <span id="display-name"></span>!</h2>
        <div class="grade-box">
            <p>Tu calificación final:</p>
            <div id="final-grade" class="grade-num"></div>
            <p id="stats-text"></p>
        </div>
        <a id="wa-link" href="#" class="btn" style="background:#25d366;" target="_blank">Enviar resultados a Rafael</a>
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
            <a href="https://www.tiktok.com/@englishsbs.peru" target="_blank" class="btn" style="background:#000; width: 40%;">TikTok</a>
            <a href="https://www.youtube.com/@Englishsbs_peru" target="_blank" class="btn" style="background:#FF0000; width: 40%;">YouTube</a>
        </div>
        <hr style="margin: 20px 0; border: 0.5px solid #eee;">
        <button class="btn" style="background: #666; width: 90%; margin-top: 10px;" onclick="location.reload()">Volver a realizar</button>
    </div>
</div>

<script>
    const positives = ["¡Muy bien hecho, sigue adelante!", "¡Veo que estás progresando, así se hace!", "¡Fantástico trabajo! Tu esfuerzo se nota.", "¡Increíble! Estás dominando el tema cada vez mejor.", "¡Lo lograste! Me alegra mucho ver tu avance.", "¡Excelente! Tienes muy claro el concepto."];
    const supports = ["Creo que necesitas revisar un poquito más este punto, ¡tú puedes!", "No te preocupes, el error es parte del aprendizaje. ¡Inténtalo de nuevo!", "Casi lo tienes, dale otra mirada a la estructura y verás el cambio.", "Buen intento, pero esta vez no es la correcta. ¡Sigue practicando!", "Me parece que hubo una pequeña confusión, ¡revisa y vuelve a intentar!", "No te desanimimes, respira profundo y fíjate bien en el detalle."];

    const questions = [
        // SECCIÓN A: Opción Múltiple (8 ejercicios) [cite: 66, 67, 68, 69, 70, 71, 72, 73, 74, 75, 77]
        {n:"Ex. A-1", type:"choice", q:"Where ________ you live?", options:[{t:"does", c:false}, {t:"do", c:true}, {t:"are", c:false}]},
        {n:"Ex. A-2", type:"choice", q:"What language ________ she speak?", options:[{t:"does", c:true}, {t:"do", c:false}, {t:"is", c:false}]},
        {n:"Ex. A-3", type:"choice", q:"My wife ________ Spanish.", options:[{t:"speak", c:false}, {t:"speaking", c:false}, {t:"speaks", c:true}]},
        {n:"Ex. A-4", type:"choice", q:"We ________ to music every day.", options:[{t:"listen", c:true}, {t:"listens", c:false}, {t:"listening", c:false}]},
        {n:"Ex. A-5", type:"choice", q:"Where ________ your husband work?", options:[{t:"do", c:false}, {t:"is", c:false}, {t:"does", c:true}]},
        {n:"Ex. A-6", type:"choice", q:"Mr. and Mrs. Gomez ________ their neighbors.", options:[{t:"visiting", c:false}, {t:"visit", c:true}, {t:"visits", c:false}]},
        {n:"Ex. A-7", type:"choice", q:"I ________ in a bank.", options:[{t:"work", c:true}, {t:"works", c:false}, {t:"working", c:false}]},
        {n:"Ex. A-8", type:"choice", q:"What ________ they do every day?", options:[{t:"does", c:false}, {t:"do", c:true}, {t:"are", c:false}]},

        // SECCIÓN B: Espacios en Blanco (7 ejercicios) [cite: 81, 87, 88, 89, 90, 92, 93, 95, 96, 97, 100]
        {n:"Ex. B-1", type:"text", inst:"Choose and write: LIVE - LIVES - DO", q:"Mr. and Mrs. Gomez ________ in Los Angeles.", accepted:["live"]},
        {n:"Ex. B-2", type:"text", inst:"Choose and write: WHAT - WHERE - DOES", q:"________ does your husband work?", accepted:["Where"]},
        {n:"Ex. B-3", type:"text", inst:"Choose and write: WORK - WORKS - DO", q:"My sister ________ in a bank.", accepted:["works"]},
        {n:"Ex. B-4", type:"text", inst:"Choose and write: WHERE - WHAT - DO", q:"________ language do you speak?", accepted:["What"]},
        {n:"Ex. B-5", type:"text", inst:"Choose and write: DOES - DO - ARE", q:"What ________ your parents talk about?", accepted:["do"]},
        {n:"Ex. B-6", type:"text", inst:"Choose and write: SHOPS - SHOP - DO", q:"We ________ in small grocery stores.", accepted:["shop"]},
        {n:"Ex. B-7", type:"text", inst:"Choose and write: SHOP - SHOPS - DOES", q:"Our son ________ in large supermarkets.", accepted:["shops"]},

        // SECCIÓN C: Diálogos (5 ejercicios) [cite: 102, 108, 109, 110, 111]
        {n:"Ex. C-1", type:"dialogue", inst:"Write the question for the answer", ans:"They speak French.", accepted:["What language do they speak"]},
        {n:"Ex. C-2", type:"dialogue", inst:"Write the question for the answer", ans:"I work in an office.", accepted:["Where do you work"]},
        {n:"Ex. C-3", type:"dialogue", inst:"Write the question for the answer", ans:"He watches TV.", accepted:["What does he do"]},
        {n:"Ex. C-4", type:"dialogue", inst:"Write the question for the answer", ans:"They live in Miami.", accepted:["Where do they live"]},
        {n:"Ex. C-5", type:"dialogue", inst:"Write the question for the answer", ans:"She lives in Dallas.", accepted:["Where does she live"]}
    ];

    let current = 0, hits = 0;

    function startQuiz() {
        const u = document.getElementById('userName').value;
        if(!u || !document.getElementById('legalConsent').checked) return alert("Por favor completa tus datos.");
        document.getElementById('display-name').innerText = u;
        document.getElementById('welcome-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        show();
    }

    function show() {
        const q = questions[current];
        document.getElementById('progress').innerText = `Ejercicio ${current+1} de ${questions.length}`;
        document.getElementById('ex-label').innerText = q.n;
        const container = document.getElementById('options-container'); container.innerHTML = '';
        const qArea = document.getElementById('question-area'); qArea.innerHTML = '';
        document.getElementById('feedback-area').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        if(q.type === "choice") {
            const h3 = document.createElement('h3'); h3.className = 'question-text'; h3.innerText = q.q;
            qArea.appendChild(h3);
            q.options.forEach(o => {
                const b = document.createElement('button'); b.className = 'option'; b.innerText = o.t;
                b.onclick = (e) => validate(o.c, o.t, e.target);
                container.appendChild(b);
            });
        } else if(q.type === "text" || q.type === "dialogue") {
            const instPara = document.createElement('p'); instPara.style.fontWeight = 'bold'; instPara.style.textAlign = 'left';
            instPara.innerText = q.inst;
            qArea.appendChild(instPara);
            
            if(q.type === "dialogue") {
                const dBox = document.createElement('div'); dBox.className = 'dialogue-box';
                dBox.innerHTML = `<strong>A:</strong> _________________?<br><strong>B:</strong> ${q.ans}`;
                qArea.appendChild(dBox);
            } else {
                const h3 = document.createElement('h3'); h3.className = 'question-text'; h3.innerText = q.q;
                qArea.appendChild(h3);
            }

            const input = document.createElement('input'); input.className = 'text-input'; input.id = 'user-input';
            const b = document.createElement('button'); b.className = 'btn'; b.innerText = "VERIFICAR";
            b.onclick = () => {
                const val = document.getElementById('user-input').value.trim();
                const clean = val.toLowerCase().replace(/[?'!.]/g, "").replace(/\s+/g, " ");
                const ok = q.accepted.some(a => a.toLowerCase().replace(/[?'!.]/g, "").replace(/\s+/g, " ") === clean);
                validate(ok, val, null);
            };
            container.appendChild(input); container.appendChild(b);
        }
    }

    function validate(ok, text, element) {
        const f = document.getElementById('feedback-area');
        if(ok) {
            if(element) element.classList.add('selected-correct');
            f.innerText = positives[Math.floor(Math.random()*positives.length)];
            f.className = "feedback correct";
            hits++;
        } else {
            if(element) element.classList.add('selected-incorrect');
            f.innerText = supports[Math.floor(Math.random()*supports.length)];
            f.className = "feedback incorrect";
        }
        f.style.display = 'block';
        document.getElementById('next-btn').style.display = 'block';
        if(element) document.querySelectorAll('.option').forEach(x => x.style.pointerEvents = 'none');
    }

    function nextQuestion() { current++; if(current < questions.length) show(); else finish(); }

    function finish() {
        let grade = Math.round((hits/questions.length)*100);
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('final-screen').classList.add('active');
        document.getElementById('final-grade').innerText = grade + "%";
        document.getElementById('stats-text').innerText = `Aciertos: ${hits} de ${questions.length}`;
        document.getElementById('wa-link').href = `https://wa.me/51990171277?text=Hola%20Rafael,%20saqué%20${grade}%%20en%20la%20práctica.`;
        
        fetch("https://formspree.io/f/xojeljpo", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ Alumno: document.getElementById('userName').value, Nota: grade + "%", Detalle: "Práctica Unidad 9 completada" })
        });
    }
</script>
</body>
</html>
